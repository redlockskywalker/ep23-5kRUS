<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профессиональный русский язык — тест</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ff;--card:#fff;--tx:#241b3d;--mu:#6f6890;--pr:#7c3aed;--pr2:#ede7ff;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--bd:#e2dcf5;--yl:#d49a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#1f1a3a;--tx:#f0ecff;--mu:#a49ec7;--pr:#a78bfa;--pr2:#2c2450;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1818;--bd:#352d5c;--yl:#facc15}}
:root[data-theme="dark"]{--bg:#15112a;--card:#1f1a3a;--tx:#f0ecff;--mu:#a49ec7;--pr:#a78bfa;--pr2:#2c2450;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1818;--bd:#352d5c;--yl:#facc15}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:780px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:21px;margin:0 0 12px}
.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:.15s}
.card:hover{border-color:var(--pr);transform:translateY(-2px)}
.card b{font-size:22px;display:block}
.bar{height:8px;background:var(--pr2);border-radius:8px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--pr2);color:var(--pr)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.q{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.sh{display:flex;gap:8px;margin-bottom:10px;font-weight:600}.sh>div{min-width:0}
.o{display:flex;gap:10px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--bd);color:inherit;font:inherit;border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;align-items:flex-start}
.o>span:first-child{font-weight:700;color:var(--pr);min-width:1.4em}.o>span:last-child{min-width:0}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.im{display:block;max-width:100%;height:auto;background:#fff;border-radius:8px;padding:6px 8px}
.rep{color:var(--yl);font-weight:700}
.pb{height:10px;background:var(--pr2);border-radius:10px;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;background:var(--pr);transition:.3s}
label{cursor:pointer;user-select:none}
.big{font-size:56px;font-weight:800;color:var(--pr);margin:6px 0}
.ch p{margin:0 0 8px;font-weight:700}.ch ul{margin:0;padding-left:20px}.ch li{margin:3px 0}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[{"q": "Предварительный вариант документа, предназначенный для рассмотрения — это:", "o": ["проект документа", "приложение отчета", "дубликат письма", "копия", "подлинник"], "n": 1}, {"q": "Устная форма делового общения:", "o": ["переговоры, беседа по телефону", "отчет", "докладная и объяснительная записка", "доверенность", "заявление"], "n": 2}, {"q": "К устной форме делового общения относятся:", "o": ["дискуссия", "распоряжения", "справка", "протокол", "инструкция"], "n": 3}, {"q": "К письменной форме делового общения относятся:", "o": ["докладная и объяснительная записка", "приветственная речь", "контактно – деловой разговор", "пресс – конференция", "дискуссия"], "n": 4}, {"q": "Выделите письменную форму делового общения:", "o": ["доверенность", "деловой разговор", "переговоры", "разговор по телефону", "интервью"], "n": 5}, {"q": "Найдите правильный вариант письменной формы делового общения:", "o": ["деловое письмо", "дискуссия", "приветственная речь", "беседа", "контактно- деловой разговор"], "n": 6}, {"q": "Укажите пример с ошибкой в образовании формы слова.", "o": ["маляра закончили ремонт", "их учебники", "самый младший", "нарисуй картину", "смотреть внимательно"], "n": 7}, {"q": "Критический отзыв о каком-нибудь сочинении, спектакле, фильме и т.п.", "o": ["рецензия", "заметка", "статья", "очерк", "интервью"], "n": 8}, {"q": "Научное и публицистическое сочинение небольшого размера в сборнике, журнале или газете:", "o": ["статья", "фельетон", "репортаж", "заметка", "рассказ"], "n": 9}, {"q": "Что означает слово сленг?", "o": ["слова, которые часто рассматриваются как нарушение норм стандартного языка", "слова, используемые небольшими группами людей, объединенных определенной профессией", "грубые слова, обычно не употребляемые образованными людьми в обществе", "слова с одинаковыми значениями", "слова с противоположными значениями"], "n": 10}, {"q": "Что такое профессионализмы?", "o": ["слова, используемые небольшими группами людей, объединенных определенной профессией", "слова с противоположными значениями", "слова с одинаковыми значениями", "грубые слова, обычно не употребляемые образованными людьми в обществе", "слова, которые часто рассматриваются как нарушение норм стандартного языка"], "n": 11}, {"q": "Что означает слово жаргонизмы?", "o": ["слова, употребляемые в разговорной речи и отсутствующие в словарях", "слова, используемые небольшими группами людей, объединенных определенной профессией", "слова с одинаковыми значениями", "слова с противоположными значениями", "грубые слова, обычно не употребляемые образованными людьми в обществе"], "n": 12}, {"q": "Что означают диалектные слова?", "o": ["слова, используемые только в определенной местности", "слова с противоположными значениями", "слова с одинаковыми значениями", "слова с одинаковыми значениями", "грубые слова, обычно не употребляемые образованными людьми в обществе"], "n": 13}, {"q": "Существительные: информация, средство, сведения являются:", "o": ["отвлеченными", "конкретными", "отглагольными", "собирательными", "вещественными"], "n": 14}, {"q": "Существительные: климат, погода, опыт являются:", "o": ["отвлеченными", "отглагольными", "конкретными", "вещественными", "собирательными"], "n": 15}, {"q": "Словарь русского языка, имеющий профессиональную направленность и предназначенный для специалистов в определённой области научных знаний или практической деятельности?", "o": ["Терминологический словарь", "Словарь иностранных слов", "Словарь синонимов", "Толковый словарь", "Словарь паронимов"], "n": 16}, {"q": "Речь называется правильной, если…", "o": ["в ней соблюдены все нормы литературного языка.", "В ней много заимствований, неологизмов", "В ней применены различные образные средства языка", "В ней использована аббревиатура", "В ней есть просторечная лексика"], "n": 17}, {"q": "Вербальные виды общения", "o": ["текст, передающий информацию с помощью слов", "мимика, жесты", "дистанция, интонация", "язык тела, голос", "символ, фигура"], "n": 18}, {"q": "Существительные: страх, смех, борьба являются:", "o": ["отвлеченными", "отглагольными", "конкретными", "вещественными", "собирательными"], "n": 19}, {"q": "Укажите обороты речевого этикета, выражающие значение благодарность:", "o": ["благодарю вас", "позвольте попрощаться", "я приглашаю вас", "здравствуйте", "будьте любезны"], "n": 20}, {"q": "Обороты речевого этикета, означающие благодарность:", "o": ["большое спасибо", "до встречи", "здравствуйте", "прошу меня простить", "я приглашаю вас"], "n": 21}, {"q": "Человек, любящий и умеющий читать, - счастливый человек. (К.Паустовский). В данном рассуждении содержится:", "o": ["Тезис", "Аргумент", "Доказательство", "Вывод", "Обоснование"], "n": 22}, {"q": "Укажите речевой этикет, употребляющийся при встрече (приветствие)", "o": ["Здравствуйте", "приношу свои извинения", "простите, пожалуйста", "будьте любезны", "счастливого пути"], "n": 23}, {"q": "Речевой этикет(приветствие), употребляющийся при встрече", "o": ["добрый день", "приношу свои извинения", "будьте любезны", "счастливого пути", "простите, пожалуйста"], "n": 24}, {"q": "Найдите речевой этикет, употребляющийся при встрече (приветствие)", "o": ["доброе утро", "будьте любезны", "счастливого пути", "приношу свои извинения", "простите, пожалуйста"], "n": 25}, {"q": "Выделите обороты речевого этикета, выражающие просьбу:", "o": ["будьте добры", "до свидания", "добрый день", "я приглашаю вас", "сердечно благодарю"], "n": 26}, {"q": "Укажите обороты речевого этикета, выражающие просьбу:", "o": ["будьте любезны", "сердечно благодарю", "до свидания", "добрый вечер", "я приглашаю вас"], "n": 27}, {"q": "Письмо, выражающее просьбу о выполнении какого-либо действия:", "o": ["письмо-просьба", "письмо-приложение", "письмо-подтверждение", "Д) письмо-напоминание", "информационное письме,"], "n": 28}, {"q": "Найдите аббревиатуры, читаемые по названиям букв:", "o": ["ЭВМ, ВДНХ", "КазГУ, КазТАГ", "спецкор, совхоз", "лесхоз, детсад", "стенгазета, промтовары"], "n": 29}, {"q": "К документам вышестоящих органов управления относятся:", "o": ["инструктивные письма", "служебные запросы", "технические отчеты", "справки", "акты"], "n": 30}, {"q": "Обращающийся к информационной системе или посреднику за получением необходимой ему информации и пользующийся ею:", "o": ["пользователь информации", "физическое лицо", "юридическое лицо", "административное лицо", "предприятие"], "n": 31}, {"q": "«Условия труда. Оплата труда. Дисциплина труда» - это реквизиты:", "o": ["контракта", "заявления", "резюме", "трудовой книжки .", "служебного приказа"], "n": 32}, {"q": "Место работы, специализация, предыдущий опыт работы, владение иностранными языками, домашний телефон - это составные части:", "o": ["резюме", "заявления", "характеристики", "справки", "контракта"], "n": 33}, {"q": "Определите, в каком варианте содержатся слова, характеризующие отношение к людям:", "o": ["доброжелательный, отзывчивый", "принципиальный, активный", "активный, общительный", "культурный, активный", "воспитанный, честный"], "n": 34}, {"q": "Текст протокола по каждому вопросу состоит:", "o": ["из трех частей: «Слушали. Выступила. Постановили»", "из двух частей: «Слушали .Постановили. »", "из двух частей : «Слушали. Выступили.", "из одной части: «Постановили.»", "из двух частей: «Выступили. Постановили.»"], "n": 35}, {"q": "Сведения о количестве присутствующих, фамилии и инициалы председателя и секретаря собрания- это реквизиты:", "o": ["протокола", "автобиография", "характеристика", "контракт", "трудовая книжка"], "n": 36}, {"q": "Предлоги, местоимения, знаки препинания исключаются в тексте:", "o": ["телеграммы", "письма-извещения", "письма-напоминания", "письма-со общения", "письма подтверждения"], "n": 37}, {"q": "Номенклатура дел - это:", "o": ["систематизированный перечень или список наименований дел", "регистрационный номер документа", "документы, в которых устанавливаются какие-либо правила, нормы", "документы, составленные учреждением или должностным лицом и оформленные в установле
